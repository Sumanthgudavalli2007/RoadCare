<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | RoadCare</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1e293b;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;padding:30px;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 35px #1e293b0c}
.logo{color:#245eea;font-size:26px;font-weight:bold;text-align:center;margin-bottom:8px} h1{font-size:25px;text-align:center;margin:12px 0} .muted{color:#64748b;text-align:center;line-height:1.6;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 7px} input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
button{width:100%;padding:13px;background:#245eea;color:#fff;border:0;border-radius:8px;margin-top:22px;font-size:15px;cursor:pointer}
a{color:#245eea;text-decoration:none} .links{text-align:center;margin-top:18px;font-size:14px} .flash{background:#fff1f2;color:#9f1239;padding:10px;border-radius:8px;margin:12px 0;font-size:14px}
</style></head><body><main class="card"><div class="logo">RoadCare</div><h1>Welcome Back</h1><p class="muted">Login to submit and track road damage reports.</p>
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="30">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Login</button></form>
<div class="links">New to RoadCare? <a href="{{ url_for('main.register') }}">Create citizen account</a></div>
</main></body></html>
